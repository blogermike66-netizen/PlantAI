<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Plant details - PlantAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
  :root{--dark:#0b2118;--deep:#146c3c;--green:#22a65a;--muted:#5d6b63}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Poppins,system-ui,sans-serif;background:#fff;color:#14231b;line-height:1.6}
  a{color:inherit;text-decoration:none}
  [hidden]{display:none!important}
  nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid #e8eeea}
  .logo{font-size:22px;font-weight:600;color:var(--dark)}
  nav ul{display:flex;gap:30px;list-style:none;font-size:14px}
  main{max-width:1000px;margin:0 auto;padding:24px 30px 50px}
  .back{font-size:13px;color:var(--muted)}
  .top{display:grid;grid-template-columns:340px 1fr;gap:34px;margin-top:18px;align-items:center}
  .top img{width:100%;border-radius:14px;display:block;max-height:340px;object-fit:cover}
  h1{font-size:32px}
  .sci{color:var(--muted);font-style:italic}
  .desc{margin-top:12px;font-size:15px;color:#33443a}
  .facts{display:flex;gap:30px;margin-top:18px;background:#eef7f1;border-radius:12px;padding:14px 18px;flex-wrap:wrap}
  .facts small{display:block;color:var(--muted);font-size:12px}
  .facts b{font-size:14px}
  .box{background:#f6faf7;border:1px solid #e3ebe6;border-radius:14px;padding:20px;margin-top:26px}
  .box h2{font-size:18px}
  .dis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}
  .dis div{background:#fff;border:1px solid #e3ebe6;border-radius:10px;padding:16px 10px;text-align:center;font-size:14px;font-weight:500}
  @media(max-width:700px){.top{grid-template-columns:1fr}.dis{grid-template-columns:1fr 1fr}}
  
  @media(max-width:720px){
    nav{padding:14px 16px!important;flex-wrap:wrap;gap:10px}
    nav ul{gap:14px!important;font-size:13px!important;flex-wrap:wrap}
    .logo{font-size:20px!important}
  }
  @media(max-width:700px){
    main{padding:18px 16px 36px}
    h1{font-size:25px}
    .facts{gap:16px}
    .box{padding:16px}
  }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="index.html">PlantAI</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="scans.html">Your Scans</a></li>
      <li><a href="privacy.html">Privacy</a></li>
    </ul>
  </nav>

  <main>
    <a class="back" href="results.html">← Back to Results</a>

    <p id="empty" hidden style="margin-top:20px">No plant selected. <a href="plantAi.html" style="color:var(--deep)">Scan a plant</a>.</p>

    <div id="view" hidden>
      <div class="top">
        <img id="photo" alt="Your plant">
        <div>
          <h1 id="name"></h1>
          <div class="sci" id="sci"></div>
          <p class="desc" id="desc"></p>
          <div class="facts">
            <div><small>Family</small><b id="family"></b></div>
            <div><small>Growth Type</small><b id="growth"></b></div>
            <div><small>Ideal Temperature</small><b id="temp"></b></div>
          </div>
        </div>
      </div>

      <div class="box" id="disBox">
        <h2>Common Diseases</h2>
        <div class="dis" id="dis"></div>
      </div>
    </div>
  </main>

<script>
const scans = JSON.parse(localStorage.getItem("scans") || "[]");
const scan = scans[Number(localStorage.getItem("open") || 0)];
const $ = (id) => document.getElementById(id);

if (!scan || !scan.result) {
  $("empty").hidden = false;
} else {
  const p = scan.result.plant || {};
  $("view").hidden = false;
  $("photo").src = scan.image;
  $("name").textContent = p.name || "Unknown plant";
  $("sci").textContent = p.scientific_name || "";
  $("desc").textContent = p.description || "";
  $("family").textContent = p.family || "-";
  $("growth").textContent = p.growth_type || "-";
  $("temp").textContent = p.ideal_temperature || "-";

  const diseases = scan.result.common_diseases || [];
  $("disBox").hidden = diseases.length === 0;
  diseases.forEach(name => {
    const d = document.createElement("div");
    d.textContent = name;
    $("dis").appendChild(d);
  });
}
</script>
</body>
</html>
