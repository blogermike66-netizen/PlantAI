<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Your Scans - PlantAI</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
  :root{--dark:#0e3b2c;--green:#22a65a;--muted:#5d6b63}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:Poppins,system-ui,sans-serif;background:var(--dark);color:#fff;min-height:100vh;line-height:1.5}
  a{color:inherit;text-decoration:none}
  nav{display:flex;align-items:center;justify-content:space-between;padding:18px 40px}
  .logo{font-size:22px;font-weight:600}
  nav ul{display:flex;gap:30px;list-style:none;font-size:14px}
  main{max-width:900px;margin:0 auto;padding:20px 30px 50px}
  h1{font-size:32px}
  .sub{color:#cfe3d8;font-size:14px;margin-bottom:16px}
  .list{background:#fff;color:#14231b;border-radius:14px;padding:4px 20px}
  .item{display:flex;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #e3ebe6;cursor:pointer}
  .item:last-child{border:0}
  .item img{width:58px;height:58px;border-radius:10px;object-fit:cover}
  .grow{flex:1}
  .grow small{color:var(--muted);font-size:12.5px}
  .pill{border:1px solid #bfe3cb;color:#146c3c;background:#eef9f1;border-radius:999px;padding:2px 12px;font-size:13px;font-weight:600}
  .arrow{color:#9aa9a0;font-size:20px}
  .none{padding:20px 0;color:var(--muted)}
  
  @media(max-width:720px){
    nav{padding:14px 16px!important;flex-wrap:wrap;gap:10px}
    nav ul{gap:14px!important;font-size:13px!important;flex-wrap:wrap}
    .logo{font-size:20px!important}
  }
  @media(max-width:720px){
    main{padding:12px 16px 36px}
    h1{font-size:26px}
    .list{padding:2px 14px}
    .item{gap:12px}
    .item img{width:48px;height:48px}
    .grow{min-width:0;overflow-wrap:anywhere}
  }
  </style>
</head>
<body>
  <nav>
    <a class="logo" href="index.html">PlantAI</a>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="plantAi.html">Scan</a></li>
      <li><a href="privacy.html">Privacy</a></li>
    </ul>
  </nav>

  <main>
    <h1>Your Scans</h1>
    <p class="sub">View your past scans and results.</p>
    <div class="list" id="list"></div>
  </main>

<script>
const list = document.getElementById("list");
const scans = JSON.parse(localStorage.getItem("scans") || "[]");

if (scans.length === 0) {
  const none = document.createElement("div");
  none.className = "none";
  none.textContent = "No scans yet.";
  list.appendChild(none);
}

scans.forEach((scan, i) => {
  const r = scan.result;
  const title = r
    ? (r.plant?.name || "Unknown plant") + (r.health?.disease ? " – " + r.health.disease : " – Healthy")
    : (scan.text || "Scan").split("\n")[0].slice(0, 60);

  const item = document.createElement("div");
  item.className = "item";

  const img = document.createElement("img");
  img.src = scan.image;

  const info = document.createElement("div");
  info.className = "grow";
  const t = document.createElement("strong");
  t.textContent = title;
  const d = document.createElement("small");
  d.textContent = scan.date;
  info.append(t, document.createElement("br"), d);

  item.append(img, info);

  if (r && r.health && r.health.confidence != null) {
    const pill = document.createElement("span");
    pill.className = "pill";
    pill.textContent = r.health.confidence + "%";
    item.append(pill);
  }

  const arrow = document.createElement("span");
  arrow.className = "arrow";
  arrow.textContent = "›";
  item.append(arrow);

  item.addEventListener("click", () => {
    localStorage.setItem("open", i);
    location.href = "results.html";
  });
  list.appendChild(item);
});
</script>
</body>
</html>
